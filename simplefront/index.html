<!doctype html>
<html lang="en" class="h-full preload" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>SimpleFront</title>
    <link rel="manifest" href="<%- manifestHref %>" />
    <link rel="icon" type="image/svg+xml" href="<%- faviconHref %>" />

    <!-- Preload styles -->
    <style>
      .preload {
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.5s ease-out;
      }

      /* iOS safe area support */
      body {
        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
      }

      /* Ensure full viewport height on iOS */
      html,
      body {
        height: 100%;
        height: -webkit-fill-available;
        min-height: 100%;
        min-height: -webkit-fill-available;
      }
    </style>

    <!-- SEO -->
    <link rel="canonical" href="https://openfront.io/" />
    <meta
      name="description"
      content="Conquer the world in this multiplayer battle royale! Expand your nation, eliminate opponents, and dominate the map in this fast-paced IO game."
    />

    <!-- Open Graph -->
    <meta property="og:url" content="https://openfront.io/" />
    <meta property="og:title" content="OpenFront - Battle Royale" />
    <meta
      property="og:description"
      content="Conquer the world in this multiplayer battle royale! Expand your nation, eliminate opponents, and dominate the map in this fast-paced IO game."
    />
    <meta property="og:image" content="<%- gameplayScreenshotUrl %>" />
    <meta property="og:type" content="game" />

    <!-- Injected from Server env -->
    <script>
      window.BOOTSTRAP_CONFIG = {
        gitCommit: <%- gitCommit %>,
        assetManifest: <%- assetManifest %>,
        cdnBase: <%- cdnBase %>,
        gameEnv: <%- gameEnv %>,
        numWorkers: <%- numWorkers %>,
        instanceId: <%- instanceId %>,
      };
      document.documentElement.style.setProperty(
        "--background-image-url",
        `url("<%- backgroundImageUrl %>")`,
      );
      // document.documentElement.style.setProperty(
      //   "--desktop-logo-image-url",
      //   `url("<%- desktopLogoImageUrl %>")`,
      // );
      document.documentElement.style.setProperty(
        "--mobile-logo-image-url",
        `url("<%- mobileLogoImageUrl %>")`,
      );
    </script>
  </head>

  <body
    class="h-full select-none font-sans min-h-screen bg-neutral-900 transition-opacity duration-300 ease-in-out flex flex-row overflow-hidden"
  >
    <!-- The hex-grid / world-map background layer was removed for the dark
         front page. Its CSS vars are still set in <head>, so re-adding the
         div is all that is needed to bring it back. -->

    <!-- Live gameplay backdrop: the real shell in `ambient` mode (no chrome, no
         input), running a timelapse of EarthMini behind the menu. Tears its sim
         down as soon as you navigate away, so only one game ever runs. Renders
         nothing without WebGPU — the flat dark page is the fallback. -->
    <game-shell-page
      id="page-backdrop"
      ambient
      class="fixed inset-0 pointer-events-none [.in-game_&]:hidden"
      style="z-index: 0"
    ></game-shell-page>

    <!-- Scrim between the live backdrop and the menu. Without it the bright
         ocean washes the title out — the backdrop has to stay legible as a
         backdrop, not compete with the text. -->
    <div
      class="fixed inset-0 pointer-events-none [.in-game_&]:hidden"
      style="
        z-index: 1;
        background: radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0.72) 0%,
          rgba(0, 0, 0, 0.52) 45%,
          rgba(0, 0, 0, 0.42) 100%
        );
      "
    ></div>

    <!-- MAIN CONTENT AREA -->
    <div
      class="in-[.in-game]:hidden flex-1 relative z-10 overflow-hidden h-full transition-[margin] duration-500 ease-out will-change-[margin-left] flex flex-col"
    >
      <!-- Main container with responsive padding -->
      <main-layout class="contents">
        <play-page class="contents"></play-page>
        <single-player-modal
          id="page-single-player"
          inline
          class="hidden w-full h-full page-content relative z-50"
        ></single-player-modal>
        <user-setting
          id="page-settings"
          inline
          class="hidden w-full h-full page-content relative z-50"
        ></user-setting>
        <troubleshooting-modal
          id="page-troubleshooting"
          inline
          class="hidden w-full h-full page-content relative z-50"
        ></troubleshooting-modal>

        <help-modal
          id="page-help"
          inline
          class="hidden w-full h-full page-content relative z-50"
        ></help-modal>
        <language-modal
          id="page-language"
          inline
          class="hidden w-full h-full page-content relative z-50"
        ></language-modal>
        <generator-page
          id="page-generator"
          class="hidden w-full h-full page-content relative z-50"
        ></generator-page>
        <webgpu-generator-page
          id="page-webgpu"
          class="hidden w-full h-full page-content relative z-50"
        ></webgpu-generator-page>
        <game-shell-page
          id="page-shell"
          class="hidden w-full h-full page-content relative z-50"
        ></game-shell-page>
        <earth-page
          id="page-earth"
          class="hidden w-full h-full page-content relative z-50"
        ></earth-page>
      </main-layout>

      <!-- <page-footer> (social links, copyright, language globe) removed for
           the clean front page; the component is still in the codebase.
           lang-selector must stay mounted though — its connectedCallback is
           what loads the translations, and translateText falls back to raw
           keys without it. Hidden, not deleted. -->
      <lang-selector class="hidden"></lang-selector>

      <!-- Global Modals -->
    </div>

    <!-- Game components -->
    <div id="app"></div>

    <!-- Bottom HUD: <sm=column, sm..lg=2col (HUD left | events right), lg+=3col grid centered -->
    <div
      class="fixed bottom-0 left-0 w-full z-[200] flex flex-col pointer-events-none sm:flex-row sm:items-end lg:grid lg:grid-cols-[1fr_500px_1fr] lg:items-end min-[1200px]:px-4"
      style="
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      "
    >
      <!-- HUD: <sm contents (children join outer flex), sm+ flex-col 460px, lg+ col-2
           (w-max + justify-self-center lets the panel+build-bar ensemble center
           over the 500px grid track when the build bar is present) -->
      <div
        class="contents sm:flex sm:flex-col sm:pointer-events-none w-full sm:w-[500px] lg:w-max lg:justify-self-center lg:col-start-2 sm:z-10"
      >
        <attacks-display
          class="w-full sm:w-[500px] pointer-events-auto order-1 sm:order-none"
        ></attacks-display>
        <div class="flex items-end gap-1.5 order-3 sm:order-none w-full">
          <div
            class="pointer-events-auto bg-gray-800/92 backdrop-blur-sm sm:rounded-tr-lg lg:rounded-t-lg min-[1200px]:rounded-lg shadow-lg w-full sm:w-[500px]"
          >
            <control-panel class="w-full"></control-panel>
          </div>
          <build-bar
            class="hidden lg:block pointer-events-auto shrink-0"
          ></build-bar>
        </div>
      </div>

      <!-- events: <sm between attacks and control (order-2), sm+ right side, lg+ col-3 -->
      <div
        class="flex flex-col pointer-events-none items-end order-2 sm:order-none sm:flex-1 lg:col-start-3 lg:self-end lg:justify-end"
      >
        <events-display
          class="w-full sm:w-auto pointer-events-auto"
        ></events-display>
        <actionable-events
          class="w-full sm:w-auto pointer-events-auto"
        ></actionable-events>
      </div>
    </div>

    <!-- Game modals and overlays -->
    <build-menu></build-menu>
    <win-modal></win-modal>
    <game-starting-modal></game-starting-modal>
    <div
      class="flex flex-col items-end fixed top-0 right-0 min-[1200px]:top-4 min-[1200px]:right-4 z-1000 gap-2"
    >
      <game-right-sidebar></game-right-sidebar>
      <replay-panel></replay-panel>
    </div>
    <settings-modal></settings-modal>
    <graphics-settings-modal></graphics-settings-modal>
    <player-panel></player-panel>
    <spawn-timer></spawn-timer>
    <immunity-timer></immunity-timer>

    <game-info-modal></game-info-modal>
    <alert-frame></alert-frame>
    <game-left-sidebar></game-left-sidebar>
    <player-info-overlay></player-info-overlay>
    <leader-board></leader-board>
    <team-stats></team-stats>
    <heads-up-message></heads-up-message>

    <!-- Scripts -->
    <script>
      // Remove preload class after everything is loaded
      window.addEventListener("load", function () {
        requestAnimationFrame(() => {
          document.documentElement.classList.remove("preload");
        });
      });

      // Fallback: remove preload class after timeout in case DOMContentLoaded never fires
      setTimeout(function () {
        document.documentElement.classList.remove("preload");
      }, 3000);
    </script>

    <script>
      // Fallback sidebar toggle so hamburger works even if module bundle fails to load
      window.__toggleSidebar = function (e) {
        try {
          const sidebar = document.getElementById("sidebar-menu");
          const backdrop = document.getElementById("mobile-menu-backdrop");
          if (!sidebar || !backdrop) return;

          const isOpen = sidebar.classList.contains("open");

          if (isOpen) {
            sidebar.classList.remove("open");
            backdrop.classList.remove("open");
            document.documentElement.classList.remove("overflow-hidden");
            sidebar.setAttribute("aria-hidden", "true");
            sidebar.removeAttribute("aria-modal");
            backdrop.setAttribute("aria-hidden", "true");
          } else {
            sidebar.classList.add("open");
            backdrop.classList.add("open");
            document.documentElement.classList.add("overflow-hidden");
            sidebar.setAttribute("aria-hidden", "false");
            sidebar.setAttribute("aria-modal", "true");
            backdrop.setAttribute("aria-hidden", "false");
          }

          const hb = document.getElementById("hamburger-btn");
          if (hb) hb.setAttribute("aria-expanded", (!isOpen).toString());
        } catch (err) {
          console.error("Toggle failed", err);
        }
      };

      // Wire up the hamburger button inline
      const hamburger = document.getElementById("hamburger-btn");
      if (hamburger) {
        hamburger.onclick = window.__toggleSidebar;
        hamburger.setAttribute("aria-expanded", "false");
      }

      // Wire up backdrop click to close menu
      const backdrop = document.getElementById("mobile-menu-backdrop");
      if (backdrop) {
        backdrop.onclick = function (e) {
          const sidebar = document.getElementById("sidebar-menu");
          if (sidebar && sidebar.classList.contains("open")) {
            window.__toggleSidebar(e);
          }
        };
      }

      // Wire up Escape key to close menu
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" || e.key === "Esc") {
          const sidebar = document.getElementById("sidebar-menu");
          if (sidebar && sidebar.classList.contains("open")) {
            window.__toggleSidebar(e);
          }
        }
      });
    </script>

    <script type="module" src="/src/client/Main.ts"></script>
  </body>
</html>
