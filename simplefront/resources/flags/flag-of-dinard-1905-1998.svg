<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 600"><title>Flag of Dinard (1905–1998)</title><desc>Description at Flags of the world: &quot;&apos;Vert, a cross ermine&apos;. A red vertical stripe is added to each quarter and the ermine spots are bicolor (black and white).&quot;

Colors are CSS green and red.

Cross is constant width of 100 px and is painted three times: once with white, once with the pattern, and once with an offset pattern.

The ermine shape copied from Zozoens, but positions are done with pattern of (90, 240). Bicolor done by clipping and then stroking the path.</desc><defs><clipPath id="c"><path d="M-100-100H0v200h-100z"/></clipPath><clipPath id="d"><path d="M-100 0h200v100h-200z"/></clipPath><pattern id="h" width="90" height="240" x="45" y="0" patternContentUnits="userSpaceOnUse" patternUnits="userSpaceOnUse"><use xlink:href="#a" transform="translate(45 35)"/></pattern><pattern id="i" width="90" height="240" x="0" y="120" patternContentUnits="userSpaceOnUse" patternUnits="userSpaceOnUse"><use xlink:href="#a" transform="translate(45 35)"/></pattern><path id="b" d="M-.908-15.63c4.175 5.18-7.5 7.241-1.206 12.144 2.685 1.664 8.956-1.94 3.447-6.368-.712-.379 2.478-2.997-2.241-5.775"/><path id="e" d="M0 0c-2.716 12.337-7.768 21.07-13.267 27.35 2.285-.627 4.87-2.404 7.355-3.963-1.52 3.235-3.057 6.037-4.577 8.891.907-.307 3.798-3.19 7.708-7.417.612 5.812 1.447 8.558 2.685 12.499.986-3.934 1.7-6.621 2.483-12.6 2.357 2.674 4.629 5.362 7.818 7.656L5.74 23.219c2.312 1.478 4.884 3.41 7.336 4.235C7.265 20.86 2.346 12.339 0 0"/><g id="a" transform="scale(2.25)"><use xlink:href="#b" clip-path="url(#c)"/><use xlink:href="#b" fill="none" stroke="#000" stroke-width=".5"/><g clip-path="url(#d)"><use xlink:href="#b" transform="rotate(90)"/><use xlink:href="#b" transform="matrix(0 1 1 0 0 0)"/></g><use xlink:href="#b" fill="none" stroke="#000" stroke-width=".5" transform="rotate(90)"/><use xlink:href="#b" fill="none" stroke="#000" stroke-width=".5" transform="matrix(0 1 1 0 0 0)"/><use xlink:href="#e" clip-path="url(#c)"/><use xlink:href="#e" fill="none" stroke="#000" stroke-width=".5"/></g><g id="f"><title>cross with no fill or stroke specification</title><desc>Fit to horizontal pitch of 90, so 360 and 540</desc><path d="M360 0h180v200h360v200H540v500H360V400H0V200h360z"/></g></defs><path fill="green" d="M0 0h900v600H0z"/><path fill="red" d="M130 0h100v600H130zm540 0h100v600H670z"/><use xlink:href="#f" fill="#fff"/><use xlink:href="#f" fill="url(#h)"/><use xlink:href="#f" fill="url(#i)"/></svg>